[project]
name = "tex2vois"
version = "0.1.0"
description = "Turn PDFs into natural-sounding audiobooks, fully offline on your own machine."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bharath Bijjam" }]
dependencies = [
    "pymupdf>=1.24",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "gradio>=4.44",
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg, so no Homebrew / admin rights needed
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
tex2vois = "tex2vois.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tex2vois"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
